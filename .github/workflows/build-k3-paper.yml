name: Build full k=3 paper PDF

on:
  push:
    branches: [main]
    paths:
      - 'papers/k3-extension-2026-09-17.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install minimal TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern

      - name: Build paper twice for stable cross-references
        working-directory: papers
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error k3-extension-2026-09-17.tex
          pdflatex -interaction=nonstopmode -halt-on-error k3-extension-2026-09-17.tex
          test -s k3-extension-2026-09-17.pdf
          grep -q 'Output written on k3-extension-2026-09-17.pdf (7 pages' k3-extension-2026-09-17.log

      - name: Commit generated PDF when changed
        run: |
          if git diff --quiet -- papers/k3-extension-2026-09-17.pdf; then
            echo 'Generated PDF is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/k3-extension-2026-09-17.pdf
          git commit -m 'Build complete k=3 paper PDF'
          git push
